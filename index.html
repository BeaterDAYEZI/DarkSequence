<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>暗蚀牌序 · Dark Sequence</title>
    <style>
      html, body { margin: 0; padding: 0; background: #0a0a0e; height: 100%; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-stamp" style="position:fixed;top:0;left:0;z-index:99998;background:#0a2a0a;color:#80e080;padding:4px 10px;font-size:12px;font-family:monospace;">✅ HTML已加载 (diag-v3)</div>
    <script>
      // 启动诊断：捕获阶段监听（连"脚本加载失败"也能抓到）
      function showBox(text, bg) {
        var box = document.createElement('div');
        box.style.cssText = 'position:fixed;top:24px;left:0;right:0;z-index:99999;background:' + (bg || '#2a0a0a') + ';color:#ffb0b0;padding:10px 16px;font-size:13px;font-family:monospace;white-space:pre-wrap;border-bottom:2px solid #a03030;';
        box.textContent = text;
        document.body.appendChild(box);
      }
      window.addEventListener('error', function (e) {
        if (e.target && e.target !== window && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          showBox('⚠ 资源加载失败: ' + (e.target.src || e.target.href || ''), '#2a1a0a');
        } else {
          showBox('⚠ 运行时错误: ' + e.message + ' @' + (e.filename || '') + ':' + (e.lineno || ''));
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        showBox('⚠ Promise错误: ' + String((e.reason && e.reason.message) || e.reason));
      });
      // 3秒后仍未渲染 → 模块未执行
      setTimeout(function () {
        var app = document.getElementById('app');
        if (!app || app.children.length === 0) {
          showBox('⏱ 3秒后页面仍未渲染——模块脚本未执行（加载被拦截或失败）。请把本页顶部所有文字截图发我。', '#2a1a0a');
        }
      }, 3000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
